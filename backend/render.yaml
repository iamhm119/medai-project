services:
  - type: web
    name: medai-backend
    runtime: python311
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        scope: all
      - key: SECRET_KEY
        scope: all
      - key: ALGORITHM
        value: HS256
        scope: all
